[build]
  command = "npm run build -w frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.example.invalid/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
