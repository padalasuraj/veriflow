<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">What is VeriFlow AI?</title><desc id="desc">A shared workspace that connects freelance agreements, delivery evidence and payment accountability.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#69dcc5"/></marker></defs><rect width="1200" height="850" rx="24" fill="#091c2b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#f4f8fc"><text x="50" y="62" font-size="32" font-weight="700">What is VeriFlow AI?</text><text x="50" y="102" fill="#a8c7d7" font-size="18">A shared workspace that connects freelance agreements, delivery evidence and payment accountability.</text><rect x="350" y="145" width="500" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="177" text-anchor="middle" font-size="20" font-weight="700">The problem</text><text x="600" y="202" text-anchor="middle" fill="#c2d4e2" font-size="16">Unclear deliverables and scattered evidence</text><path d="M 600 223 V 270" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="270" width="500" height="78" rx="16" fill="#204b4b" stroke="#548097"/><text x="600" y="302" text-anchor="middle" font-size="20" font-weight="700">VeriFlow AI</text><text x="600" y="327" text-anchor="middle" fill="#c2d4e2" font-size="16">One traceable record from agreement to receipt</text><path d="M 600 348 V 375 H 230 V 410" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><path d="M 600 348 V 410" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><path d="M 600 348 V 375 H 970 V 410" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="410" width="340" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="230" y="442" text-anchor="middle" font-size="20" font-weight="700">Client</text><text x="230" y="467" text-anchor="middle" fill="#c2d4e2" font-size="16">Defines criteria and approves work</text><rect x="430" y="410" width="340" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="442" text-anchor="middle" font-size="20" font-weight="700">AI assistant</text><text x="600" y="467" text-anchor="middle" fill="#c2d4e2" font-size="16">Suggests plans and assesses claims</text><rect x="800" y="410" width="340" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="970" y="442" text-anchor="middle" font-size="20" font-weight="700">Freelancer</text><text x="970" y="467" text-anchor="middle" fill="#c2d4e2" font-size="16">Delivers work and submits evidence</text><path d="M 230 488 V 535 H 600 V 580" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><path d="M 600 488 V 580" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><path d="M 970 488 V 535 H 600" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="580" width="500" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="612" text-anchor="middle" font-size="20" font-weight="700">Human-approved PayPal Sandbox checkout</text><text x="600" y="637" text-anchor="middle" fill="#c2d4e2" font-size="16">Server verifies capture before marking paid</text><path d="M 600 658 V 710" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="710" width="500" height="78" rx="16" fill="#204b4b" stroke="#548097"/><text x="600" y="742" text-anchor="middle" font-size="20" font-weight="700">The outcome</text><text x="600" y="767" text-anchor="middle" fill="#c2d4e2" font-size="16">Clear scope, revision history, decisions and receipts</text></g></svg>
