<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1920" viewBox="0 0 1200 1920" role="img" aria-labelledby="title desc"><title id="title">How VeriFlow functions: step by step</title><desc id="desc">Follow the arrows. Human decisions control approval; only a verified capture marks a milestone paid.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#69dcc5"/></marker></defs><rect width="1200" height="1920" rx="24" fill="#091c2b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#f4f8fc"><text x="50" y="62" font-size="32" font-weight="700">How VeriFlow functions: step by step</text><text x="50" y="102" fill="#a8c7d7" font-size="18">Follow the arrows. Human decisions control approval; only a verified capture marks a milestone paid.</text><rect x="330" y="145" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="177" text-anchor="middle" font-size="20" font-weight="700">1. Register / sign in</text><text x="600" y="202" text-anchor="middle" fill="#c2d4e2" font-size="16">Separate client and freelancer accounts</text><path d="M 600 223 V 260" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="260" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="292" text-anchor="middle" font-size="20" font-weight="700">2. Create and assign a project</text><text x="600" y="317" text-anchor="middle" fill="#c2d4e2" font-size="16">Client sets requirements, budget and freelancer</text><path d="M 600 338 V 375" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="375" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="407" text-anchor="middle" font-size="20" font-weight="700">3. Define milestone agreements</text><text x="600" y="432" text-anchor="middle" fill="#c2d4e2" font-size="16">Write criteria manually or edit and save an AI plan</text><path d="M 600 453 V 490" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="490" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="522" text-anchor="middle" font-size="20" font-weight="700">4. Submit delivery evidence</text><text x="600" y="547" text-anchor="middle" fill="#c2d4e2" font-size="16">Freelancer adds work notes and reference links</text><path d="M 600 568 V 605" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="605" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="637" text-anchor="middle" font-size="20" font-weight="700">5. Start review and inspect the work</text><text x="600" y="662" text-anchor="middle" fill="#c2d4e2" font-size="16">Optional advisory AI assessment; links are not fetched</text><path d="M 600 683 V 738" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><path d="M 600 738 L 745 800 L 600 862 L 455 800 Z" fill="#234b51" stroke="#69dcc5"/><text x="600" y="806" text-anchor="middle" font-size="19" font-weight="700">Client approves?</text><path d="M 455 800 H 170 V 688" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="173" y="765" fill="#9af0dd" font-size="16" text-anchor="middle">No: request changes</text><rect x="25" y="610" width="275" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="162.5" y="642" text-anchor="middle" font-size="20" font-weight="700">Revise and resubmit</text><text x="162.5" y="667" text-anchor="middle" fill="#c2d4e2" font-size="16">Earlier evidence is retained</text><path d="M 162 610 V 529 H 330" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><path d="M 600 862 V 925" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="898" fill="#9af0dd" font-size="16" text-anchor="middle">Yes</text><rect x="330" y="925" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="957" text-anchor="middle" font-size="20" font-weight="700">6. Load PayPal Sandbox checkout</text><text x="600" y="982" text-anchor="middle" fill="#c2d4e2" font-size="16">Configured credentials required; server creates order</text><path d="M 600 1003 V 1058" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><path d="M 600 1058 L 745 1120 L 600 1182 L 455 1120 Z" fill="#234b51" stroke="#69dcc5"/><text x="600" y="1126" text-anchor="middle" font-size="19" font-weight="700">Buyer approves?</text><path d="M 745 1120 H 960 V 964 H 870" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="989" y="1035" fill="#9af0dd" font-size="16" text-anchor="middle">Cancel: retry checkout</text><path d="M 600 1182 V 1240" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="1215" fill="#9af0dd" font-size="16" text-anchor="middle">Yes</text><rect x="330" y="1240" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="1272" text-anchor="middle" font-size="20" font-weight="700">7. Capture and verify on the server</text><text x="600" y="1297" text-anchor="middle" fill="#c2d4e2" font-size="16">Check order, invoice, capture status, amount and currency</text><path d="M 600 1318 V 1373" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><path d="M 600 1373 L 745 1435 L 600 1497 L 455 1435 Z" fill="#234b51" stroke="#69dcc5"/><text x="600" y="1441" text-anchor="middle" font-size="19" font-weight="700">Capture verified?</text><path d="M 745 1435 H 965 V 1540" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="973" y="1405" fill="#9af0dd" font-size="16" text-anchor="middle">No / uncertain</text><rect x="800" y="1540" width="350" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="975" y="1572" text-anchor="middle" font-size="20" font-weight="700">Keep unpaid / unresolved</text><text x="975" y="1597" text-anchor="middle" fill="#c2d4e2" font-size="16">Reconcile the existing order</text><path d="M 965 1618 V 1670 H 1170 V 1279 H 870" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="1095" y="1660" fill="#9af0dd" font-size="16" text-anchor="middle">Recheck</text><path d="M 600 1497 V 1550" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="1528" fill="#9af0dd" font-size="16" text-anchor="middle">Yes</text><rect x="330" y="1550" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="1582" text-anchor="middle" font-size="20" font-weight="700">8. Mark milestone PAID</text><text x="600" y="1607" text-anchor="middle" fill="#c2d4e2" font-size="16">Persist receipt and audit history for both participants</text><path d="M 600 1628 V 1690" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="1690" width="540" height="78" rx="16" fill="#152b3d" stroke="#548097"/><text x="600" y="1722" text-anchor="middle" font-size="20" font-weight="700">Continue with remaining milestones</text><text x="600" y="1747" text-anchor="middle" fill="#c2d4e2" font-size="16">Repeat delivery, review and payment for each milestone</text><path d="M 330 1729 H 315 V 529 H 330" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="205" y="1700" fill="#9af0dd" font-size="16" text-anchor="middle">More milestones</text><rect x="250" y="1805" width="700" height="78" rx="16" fill="#204b4b" stroke="#548097"/><text x="600" y="1837" text-anchor="middle" font-size="20" font-weight="700">When all milestones are paid, the workflow is complete</text><text x="600" y="1862" text-anchor="middle" fill="#c2d4e2" font-size="16">Sandbox test money only. No escrow or freelancer payouts.</text><path d="M 600 1768 V 1805" fill="none" stroke="#69dcc5" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="1793" fill="#9af0dd" font-size="16" text-anchor="middle">All paid</text></g></svg>
