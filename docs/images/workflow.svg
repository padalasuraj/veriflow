<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">VeriFlow AI · From agreement to payment</title><desc id="desc">A shared record for clients and freelancers. Follow the numbered workflow.. Define the agreement. Client sets budget and criteria.. AI proposes an editable plan.; Deliver the evidence. Freelancer submits work notes. and links; revisions are retained.; Assess the submission. Advisory AI checks criteria.. Unverified evidence stays visible.; Make a human decision. Client approves or requests. changes; AI cannot authorize pay.; Approve Sandbox checkout. Buyer approves in PayPal.. Backend uses the stored amount.; Verify and record. Server verifies completed capture.. Receipt and audit history persist.</desc><rect width="1200" height="590" rx="24" fill="#091c2b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#f4f8fc"><text x="48" y="67" font-size="36" font-weight="700">VeriFlow AI · From agreement to payment</text><text x="48" y="108" font-size="19" fill="#8de7d3">A shared record for clients and freelancers. Follow the numbered workflow.</text><g transform="translate(48 155)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">1</text><text x="58" y="39" font-size="21" font-weight="700">Define the agreement</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Client sets budget and criteria.</text><text x="22" y="108" fill="#c2d4e2" font-size="17">AI proposes an editable plan.</text></g><g transform="translate(422 155)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">2</text><text x="58" y="39" font-size="21" font-weight="700">Deliver the evidence</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Freelancer submits work notes</text><text x="22" y="108" fill="#c2d4e2" font-size="17">and links; revisions are retained.</text></g><g transform="translate(796 155)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">3</text><text x="58" y="39" font-size="21" font-weight="700">Assess the submission</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Advisory AI checks criteria.</text><text x="22" y="108" fill="#c2d4e2" font-size="17">Unverified evidence stays visible.</text></g><g transform="translate(48 325)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">4</text><text x="58" y="39" font-size="21" font-weight="700">Make a human decision</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Client approves or requests</text><text x="22" y="108" fill="#c2d4e2" font-size="17">changes; AI cannot authorize pay.</text></g><g transform="translate(422 325)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">5</text><text x="58" y="39" font-size="21" font-weight="700">Approve Sandbox checkout</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Buyer approves in PayPal.</text><text x="22" y="108" fill="#c2d4e2" font-size="17">Backend uses the stored amount.</text></g><g transform="translate(796 325)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">6</text><text x="58" y="39" font-size="21" font-weight="700">Verify and record</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Server verifies completed capture.</text><text x="22" y="108" fill="#c2d4e2" font-size="17">Receipt and audit history persist.</text></g><text x="48" y="562" font-size="17" fill="#8de7d3">Changes requested → revised evidence → review again. Only verified capture → PAID.</text></g></svg>
