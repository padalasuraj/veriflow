<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Technical architecture</title><desc id="desc">Browser → same-origin /api proxy → Express → persistent database and external services. React workspace. TypeScript · Vite · React Query. Forms, reports and role-based UI; Vercel or Netlify. Static frontend + SPA fallback. /api requests proxy to backend; Express API. Sessions · CSRF · Zod · ownership. Business rules enforced on server; Persistent SQLite. Prisma · relational constraints. Evidence, approvals, audit, receipts; AI provider. Labeled deterministic mock OR. OpenAI structured JSON outputs; PayPal Sandbox. Browser SDK: buyer approval. Server: OAuth, Orders v2, capture</desc><rect width="1200" height="590" rx="24" fill="#091c2b"/><g font-family="Segoe UI,Arial,sans-serif" fill="#f4f8fc"><text x="48" y="67" font-size="36" font-weight="700">Technical architecture</text><text x="48" y="108" font-size="19" fill="#8de7d3">Browser → same-origin /api proxy → Express → persistent database and external services</text><g transform="translate(48 155)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">1</text><text x="58" y="39" font-size="21" font-weight="700">React workspace</text><text x="22" y="80" fill="#c2d4e2" font-size="17">TypeScript · Vite · React Query</text><text x="22" y="108" fill="#c2d4e2" font-size="17">Forms, reports and role-based UI</text></g><g transform="translate(422 155)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">2</text><text x="58" y="39" font-size="21" font-weight="700">Vercel or Netlify</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Static frontend + SPA fallback</text><text x="22" y="108" fill="#c2d4e2" font-size="17">/api requests proxy to backend</text></g><g transform="translate(796 155)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">3</text><text x="58" y="39" font-size="21" font-weight="700">Express API</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Sessions · CSRF · Zod · ownership</text><text x="22" y="108" fill="#c2d4e2" font-size="17">Business rules enforced on server</text></g><g transform="translate(48 325)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">4</text><text x="58" y="39" font-size="21" font-weight="700">Persistent SQLite</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Prisma · relational constraints</text><text x="22" y="108" fill="#c2d4e2" font-size="17">Evidence, approvals, audit, receipts</text></g><g transform="translate(422 325)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">5</text><text x="58" y="39" font-size="21" font-weight="700">AI provider</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Labeled deterministic mock OR</text><text x="22" y="108" fill="#c2d4e2" font-size="17">OpenAI structured JSON outputs</text></g><g transform="translate(796 325)"><rect width="350" height="142" rx="18" fill="#152b3d" stroke="#315268"/><circle cx="30" cy="32" r="16" fill="#41ddbd"/><text x="30" y="38" text-anchor="middle" fill="#071b2b" font-weight="700">6</text><text x="58" y="39" font-size="21" font-weight="700">PayPal Sandbox</text><text x="22" y="80" fill="#c2d4e2" font-size="17">Browser SDK: buyer approval</text><text x="22" y="108" fill="#c2d4e2" font-size="17">Server: OAuth, Orders v2, capture</text></g><text x="48" y="562" font-size="17" fill="#8de7d3">One persistent backend instance. Secrets stay on the server. No escrow or freelancer payouts.</text></g></svg>
